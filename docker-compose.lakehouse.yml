services:
  # ============================================================================
  # 1. Real-Time Streaming Ingestion: Apache Kafka 4.0 (KRaft Mode)
  # ============================================================================
  kafka:
    image: apache/kafka:4.0.0
    container_name: earbuds-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://earbuds-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@earbuds-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - etl-network

  # ============================================================================
  # 2. Lakehouse S3 Storage Layer: MinIO Object Store
  # ============================================================================
  minio:
    image: elestio/minio:latest
    container_name: earbuds-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - etl-network

  # Helper: Ensure MinIO 'lakehouse' bucket exists
  minio-init:
    image: elestio/minio:latest
    container_name: earbuds-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 admin admin123) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/lakehouse;
      echo 'MinIO lakehouse bucket initialized successfully.';
      exit 0;
      "
    networks:
      - etl-network

  # ============================================================================
  # 3. Open Table Format Catalog: Apache Iceberg REST Catalog
  # ============================================================================
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: earbuds-iceberg-rest
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3a://lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123
      AWS_REGION: us-east-1
    depends_on:
      - minio-init
    networks:
      - etl-network

  # ============================================================================
  # 4. Distributed Query Serving Engine: Trino
  # ============================================================================
  trino:
    image: trinodb/trino:472
    container_name: earbuds-trino
    ports:
      - "8085:8080"
    volumes:
      - ./trino/etc/catalog:/etc/trino/catalog
      - ./trino/etc/jvm.config:/etc/trino/jvm.config
    depends_on:
      - iceberg-rest
      - minio
    networks:
      - etl-network

  # ============================================================================
  # 5. Lakehouse Maintenance & Orchestration: Apache Airflow 3.0
  # ============================================================================
  airflow:
    image: project-airflow:latest
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: earbuds-airflow
    ports:
      - "${AIRFLOW_PORT:-8082}:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      KAFKA_SERVER: earbuds-kafka:29092
      TRINO_HOST: earbuds-trino
      TRINO_PORT: 8080
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: earbuds_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-sathvik2004}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/secrets/simple_auth_manager_passwords.json"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./scripts:/opt/airflow/scripts
      - ./etl:/opt/airflow/etl
      - ./spark_streaming:/opt/airflow/spark_streaming
      - ./benchmarks:/opt/airflow/benchmarks
      - ./airflow/secrets:/opt/airflow/secrets
    networks:
      - etl-network
    command: standalone

volumes:
  minio_data:

networks:
  etl-network:
    external: true

